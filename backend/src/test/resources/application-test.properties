spring.datasource.url=jdbc:h2:mem:upr_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# Test-only legacy bearer authentication for existing integration fixtures.
jwt.secret=test-secret-key-for-testing-only-must-be-at-least-32-characters-long
jwt.expiration-ms=3600000
app.security.csrf-enabled=false

# Logging
logging.level.com.urbanproblems=DEBUG
logging.level.org.springframework.security=DEBUG

app.file-upload.upload-dir=${java.io.tmpdir}/urban-problems-test-uploads/
app.cors.allowed-origins=http://localhost:5173
app.bootstrap.system-admin.email=
