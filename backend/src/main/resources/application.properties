spring.application.name=urban-problem-reporting
spring.config.import=optional:file:.env[.properties]

app.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/upr}
app.datasource.username=${DB_USERNAME:root}
app.datasource.password=${DB_PASSWORD:root}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Schema migrations run automatically before Hibernate validates the schema.
# baseline-on-migrate adopts the pre-existing `upr` schema as-is and then applies
# any pending scripts from src/main/resources/db/migration exactly once.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server-side sessions are stored in MySQL and expire after 24 hours of inactivity.
spring.session.store-type=jdbc
spring.session.timeout=24h
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.name=CGSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=24h

# File Upload Configuration
app.file-upload.upload-dir=${FILE_UPLOAD_DIR:${user.home}/urban-problem-uploads/}
app.file-upload.max-file-size=10485760
app.file-upload.max-files=5
app.file-upload.allowed-extensions=jpg,jpeg,png,pdf,doc,docx
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS (comma-separated origins; credentials are not allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# First system administrator, or an explicitly requested one-time replacement
app.bootstrap.system-admin.email=${BOOTSTRAP_SYSTEM_ADMIN_EMAIL:}
app.bootstrap.system-admin.first-name=${BOOTSTRAP_SYSTEM_ADMIN_FIRST_NAME:System}
app.bootstrap.system-admin.last-name=${BOOTSTRAP_SYSTEM_ADMIN_LAST_NAME:Administrator}
app.bootstrap.system-admin.replace-existing=${BOOTSTRAP_SYSTEM_ADMIN_REPLACE_EXISTING:false}
app.bootstrap.exit-after=${APP_BOOTSTRAP_EXIT_AFTER:false}
app.bootstrap.system-admin.password=${BOOTSTRAP_SYSTEM_ADMIN_PASSWORD:}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.com.urbanproblems=INFO
logging.level.org.springframework.security=WARN
